<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.5" stop-color="#131316"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#glow)"/>

  <!-- Shield -->
  <g transform="translate(60, 40)">
    <path d="M40 0 L76 14 L76 50 Q76 88 40 104 Q4 88 4 50 L4 14 Z" fill="#0a0a0b" stroke="url(#teal)" stroke-width="2"/>
    <path d="M40 6 L70 19 L70 48 Q70 82 40 96 Q10 82 10 48 L10 19 Z" fill="#5eead4" fill-opacity="0.08"/>
    <text x="40" y="62" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#5eead4">W</text>
  </g>

  <!-- Title -->
  <text x="175" y="75" font-family="sans-serif" font-size="36" font-weight="bold" fill="#e8e8ea" letter-spacing="-1">Warden</text>

  <!-- Subtitle -->
  <text x="177" y="100" font-family="sans-serif" font-size="14" fill="#8a8a94">Structurally-verified context layer for AI coding agents</text>

  <!-- Pills -->
  <g font-family="monospace" font-size="11">
    <rect x="177" y="120" width="110" height="22" rx="11" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="232" y="135" text-anchor="middle" fill="#4ade80">91% token cut</text>

    <rect x="297" y="120" width="120" height="22" rx="11" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="357" y="135" text-anchor="middle" fill="#5eead4">100% verbatim</text>

    <rect x="427" y="120" width="90" height="22" rx="11" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="472" y="135" text-anchor="middle" fill="#fbbf24">30+ agents</text>

    <rect x="527" y="120" width="55" height="22" rx="11" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="554" y="135" text-anchor="middle" fill="#8a8a94">free</text>

    <rect x="592" y="120" width="80" height="22" rx="11" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="632" y="135" text-anchor="middle" fill="#8a8a94">local only</text>
  </g>

  <!-- Install line -->
  <text x="177" y="175" font-family="monospace" font-size="13" fill="#565660">$ npm install -g warden-ai &amp;&amp; warden init</text>

  <!-- Accent bars -->
  <rect x="0" y="0" width="3" height="220" fill="url(#teal)" opacity="0.6"/>
  <rect x="897" y="0" width="3" height="220" fill="url(#teal)" opacity="0.6"/>
</svg>
