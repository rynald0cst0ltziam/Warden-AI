<svg xmlns="http://www.w3.org/2000/svg" width="940" height="200" viewBox="0 0 940 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="940" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.5" stop-color="#111114"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="940" height="200" fill="url(#bg)"/>
  <rect width="940" height="200" fill="url(#glow)"/>

  <!-- Shield + W -->
  <g transform="translate(80, 50)">
    <path d="M36 0 L68 12 L68 44 Q68 78 36 92 Q4 78 4 44 L4 12 Z" fill="#0a0a0b" stroke="url(#teal)" stroke-width="1.5"/>
    <path d="M36 5 L63 16 L63 43 Q63 73 36 85 Q9 73 9 43 L9 16 Z" fill="#5eead4" fill-opacity="0.06"/>
    <text x="36" y="56" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#5eead4">W</text>
  </g>

  <!-- Title -->
  <text x="185" y="72" font-family="sans-serif" font-size="34" font-weight="bold" fill="#e8e8ea" letter-spacing="-1">Warden</text>

  <!-- Tagline -->
  <text x="187" y="96" font-family="sans-serif" font-size="13" fill="#7a7a84">Structurally-verified context layer for AI coding agents</text>

  <!-- Feature pills -->
  <g font-family="monospace" font-size="10">
    <rect x="187" y="115" width="95" height="20" rx="10" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="234" y="128" text-anchor="middle" fill="#4ade80">50-90% cut</text>

    <rect x="292" y="115" width="105" height="20" rx="10" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="344" y="128" text-anchor="middle" fill="#5eead4">100% verbatim</text>

    <rect x="407" y="115" width="80" height="20" rx="10" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="447" y="128" text-anchor="middle" fill="#fbbf24">30+ agents</text>

    <rect x="497" y="115" width="55" height="20" rx="10" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="524" y="128" text-anchor="middle" fill="#7a7a84">free</text>

    <rect x="562" y="115" width="70" height="20" rx="10" fill="#131316" stroke="#26262d" stroke-width="1"/>
    <text x="597" y="128" text-anchor="middle" fill="#7a7a84">local only</text>
  </g>

  <!-- Install command -->
  <text x="187" y="165" font-family="monospace" font-size="12" fill="#565660">$ npm install -g warden-ai &amp;&amp; warden init</text>

  <!-- Accent bars -->
  <rect x="0" y="0" width="2" height="200" fill="url(#teal)" opacity="0.5"/>
  <rect x="938" y="0" width="2" height="200" fill="url(#teal)" opacity="0.5"/>
</svg>
